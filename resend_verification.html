<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resend Verification | What Can I Make?</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #fffaf5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(60, 40, 30, 0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #81766e;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd2c9;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #d96b4c;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #d96b4c;
            text-decoration: none;
        }

        .error {
            background: #fff0ed;
            color: #b94d35;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .success {
            background: #edf9f0;
            color: #287a3d;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Verify your email 📧</h1>

    <p>
        Enter your email and we'll send you a new verification link.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    {% if success %}
        <div class="success">
            {{ success }}
        </div>
    {% endif %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Resend Verification Email
        </button>

    </form>

    <a href="{{ url_for('login') }}">
        ← Back to Login
    </a>

</div>

</body>
</html>
