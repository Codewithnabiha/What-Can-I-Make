<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | What Can I Make?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "DM Sans", sans-serif;
            min-height: 100vh;
            background: #fffaf5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
        }

        .back-home {
            display: inline-block;
            margin-bottom: 25px;
            color: #6b625c;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #d96b4c;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(60, 40, 30, 0.10);
            border: 1px solid #f0e6dd;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: "Playfair Display", serif;
            text-align: center;
            font-size: 32px;
            color: #302721;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #81766e;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #403731;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd2c9;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #d96b4c;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #d96b4c;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #aaa;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e8ddd5;
        }

        .switch-text {
            text-align: center;
            color: #81766e;
            font-size: 14px;
        }

        .switch-text a {
            color: #d96b4c;
            text-decoration: none;
            font-weight: 700;
        }

        .error {
            background: #fff0ed;
            color: #b94d35;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="auth-container">

    <a href="/" class="back-home">
        ← Back to home
    </a>

    <div class="auth-card">

        <div class="logo">
            🍳
        </div>

        <h1>Create an account</h1>

        <p class="subtitle">
            Join What Can I Make? and discover delicious recipes
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <button type="submit" class="auth-btn">
                Sign up
            </button>

        </form>

        <div class="divider">
            OR
        </div>
 
  
        <p class="switch-text">
            Already have an account?
            <a href="/login">Log in</a>
        </p>

    </div>

</div>

</body>
</html>
